<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    .auth-panel { padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; margin: 22px 0; }
    .auth-panel h2 { margin: 0 0 12px; font-size: 21px; }
    .auth-panel form { display: grid; gap: 10px; }
    .auth-panel label { font-size: 14px; color: #bfd0e5; }
    .auth-panel input { box-sizing: border-box; width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #859ab0; background: #101a28; color: white; font: inherit; }
    .auth-panel button { padding: 12px 18px; border: 0; border-radius: 8px; background: #8ad8df; color: #101a28; font-weight: bold; cursor: pointer; }
    .auth-panel button:disabled { opacity: .6; cursor: wait; }
    .auth-panel [hidden] { display: none; }
    #auth-message { min-height: 1.5em; margin: 12px 0 0; font-size: 14px; }
    #auth-message[data-error="true"] { color: #ffbdc7; }
    .memo-panel { border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; padding: 18px; margin: 20px 0; }
    .memo-panel[hidden] { display:none; }
    .memo-panel form { display:grid; gap:10px; }
    .memo-panel input, .memo-panel textarea { width:100%; box-sizing:border-box; background:#101a28; color:#fff; border:1px solid #859ab0; border-radius:8px; padding:10px; font:inherit; }
    .memo-panel button, .memo-actions button { background:#8ad8df; color:#101a28; border:0; border-radius:7px; padding:9px 13px; font-weight:700; cursor:pointer; }
    .memo-actions { display:flex; gap:8px; margin-top:10px; }
    #memo-message { min-height:1.5em; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 로그인 보호 자료</div>
    <h1>점령된 자료실</h1>
    <p>메모는 공개 정적 파일이 아니라 서버 API에서 가져옵니다. 아래는 학습용 가상 자료입니다.</p>
    <div class="notice">서버는 로그인 토큰을 검증한 뒤에만 학습용 메모를 반환합니다. 사용자별 접근 제한은 다음 단계에서 구현합니다.</div>
    <section class="auth-panel" aria-labelledby="auth-title">
      <h2 id="auth-title">Supabase Auth 로그인</h2>
      <p id="auth-state" aria-live="polite">로그인 상태 확인 중...</p>
      <form id="login-form" hidden>
        <label for="auth-email">이메일</label>
        <input id="auth-email" name="email" type="email" autocomplete="username" required>
        <label for="auth-password">비밀번호</label>
        <input id="auth-password" name="password" type="password" autocomplete="current-password" required>
        <button id="login-button" type="submit">로그인</button>
      </form>
      <button id="logout-button" type="button" hidden>로그아웃</button>
      <p id="auth-message" role="status" aria-live="polite"></p>
    </section>
    <section id="memo-panel" class="memo-panel" hidden>
      <h2 id="memo-heading">가상 메모 추가</h2>
      <form id="memo-form">
        <label for="memo-title">제목</label><input id="memo-title" maxlength="160" required>
        <label for="memo-body">본문</label><textarea id="memo-body" rows="4" maxlength="10000"></textarea>
        <div class="memo-actions"><button type="submit" id="memo-save">저장</button><button type="button" id="memo-cancel" hidden>수정 취소</button></div>
      </form>
      <p id="memo-message" role="status" aria-live="polite"></p>
    </section>
    <ul id="notes" aria-live="polite"><li>로그인하면 가상 자료를 볼 수 있습니다.</li></ul>
  </main>
  <script type="module">
// 인증과 메모 요청은 같은 출처의 서버 함수를 사용합니다.
async function authRequest(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    cache: 'no-store',
    credentials: 'same-origin',
    headers: {
      ...options.headers
    }
  });

  return response;
}
    const loginForm = document.querySelector('#login-form');
    const logoutButton = document.querySelector('#logout-button');
    const loginButton = document.querySelector('#login-button');
    const authState = document.querySelector('#auth-state');
    const authMessage = document.querySelector('#auth-message');
    const list = document.querySelector('#notes');
    const memoPanel = document.querySelector('#memo-panel');
    const memoForm = document.querySelector('#memo-form');
    const memoTitle = document.querySelector('#memo-title');
    const memoBody = document.querySelector('#memo-body');
    const memoMessage = document.querySelector('#memo-message');
    const memoCancel = document.querySelector('#memo-cancel');
    const memoHeading = document.querySelector('#memo-heading');
    let latestLoad = 0;
    let editingId = null;
    let activeSession = null;
    let currentNotes = [];

    function message(text, error = false) {
      authMessage.textContent = text;
      authMessage.dataset.error = String(error);
    }
    function renderAuth(user) {
      authState.textContent = user ? `로그인됨: ${user.email ?? '이메일 비공개'}` : '로그아웃 상태입니다.';
      loginForm.hidden = Boolean(user);
      logoutButton.hidden = !user;
      memoPanel.hidden = !user;
      if (user) loginForm.reset();
    }
    function showNotes(text) {
      const item = document.createElement('li');
      item.textContent = text;
      list.replaceChildren(item);
    }
    function resetEditor() {
      editingId = null;
      memoForm.reset();
      memoHeading.textContent = '가상 메모 추가';
      memoCancel.hidden = true;
    }

async function requestMemo(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    cache: 'no-store',
    credentials: 'same-origin',
    headers: { ...options.headers }
  });

  if (response.status === 401) {
    throw new Error('인증이 만료됐습니다. 다시 로그인해 주세요.');
  }

  if (!response.ok) {
    throw new Error(`서버 요청 실패 (${response.status})`);
  }

  return response.status === 204 ? null : response.json();
}

async function loadNotes(authenticated) {
  const requestNumber = ++latestLoad;
  currentNotes = [];

  showNotes(authenticated
    ? '가상 자료를 불러오는 중입니다.'
    : '로그인하면 가상 자료를 볼 수 있습니다.');

  if (!authenticated) return;

  try {
    const response = await fetch('/api/memos', {
      cache: 'no-store',
      credentials: 'same-origin'
    });
        if (requestNumber !== latestLoad) return;
        if (response.status === 401) { showNotes('인증이 만료됐습니다. 다시 로그인해 주세요.'); return; }
        if (!response.ok) throw new Error(`자료 조회 실패 (${response.status})`);
        const data = await response.json();
        if (requestNumber !== latestLoad) return;
        if (!Array.isArray(data.notes)) throw new Error('자료 형식이 올바르지 않습니다.');
        currentNotes = data.notes;
        if (!currentNotes.length) { showNotes('저장된 가상 메모가 없습니다.'); return; }
        list.replaceChildren(...currentNotes.map(note => {
          const li = document.createElement('li');
          const title = document.createElement('strong');
          const body = document.createElement('span');
          title.textContent = note.title;
          body.textContent = note.body;
          const buttons = document.createElement('div');
          buttons.className = 'memo-actions';
          const edit = document.createElement('button');
          edit.type = 'button'; edit.textContent = '수정';
          edit.addEventListener('click', () => {
            editingId = note.id;
            memoTitle.value = note.title;
            memoBody.value = note.body;
            memoHeading.textContent = '가상 메모 수정';
            memoCancel.hidden = false;
            memoTitle.focus();
          });
          const del = document.createElement('button');
          del.type = 'button'; del.textContent = '삭제';
          del.addEventListener('click', async () => {
            if (!confirm('이 가상 메모를 삭제하시겠습니까?')) return;
            try {
              await requestMemo(`/api/memos/${encodeURIComponent(note.id)}`, { method:'DELETE' });
              memoMessage.textContent = '삭제했습니다.';
              if (editingId === note.id) resetEditor();
	      await loadNotes(true);
            } catch (e) { memoMessage.textContent = e.message; }
          });
          buttons.append(edit,del);
          li.append(title,body,buttons);
          return li;
        }));
      } catch (e) { if (requestNumber === latestLoad) showNotes(e.message ?? '자료 조회 실패'); }
    }
    memoCancel.addEventListener('click', resetEditor);
    memoForm.addEventListener('submit', async event => {
      event.preventDefault();
      const payload = { title: memoTitle.value.trim(), body: memoBody.value };
      if (!payload.title) return;
      const save = document.querySelector('#memo-save');
      save.disabled = true;
      try {
        await requestMemo(editingId ? `/api/memos/${encodeURIComponent(editingId)}` : '/api/memos', {
          method: editingId ? 'PUT' : 'POST',
          headers: { 'Content-Type':'application/json' }, body: JSON.stringify(payload),
        });
        memoMessage.textContent = editingId ? '수정했습니다.' : '추가했습니다.';
        resetEditor();
        await loadNotes(true);
      } catch (e) { memoMessage.textContent = e.message; }
      finally { save.disabled = false; }
    });

loginForm.addEventListener('submit', async event => {
  event.preventDefault();
  loginButton.disabled = true;
  message('로그인 중...');

  try {
    const response = await authRequest('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: loginForm.elements.email.value.trim(),
        password: loginForm.elements.password.value
      })
    });

    if (!response.ok) {
      throw new Error(`로그인 실패 (${response.status})`);
    }

    const data = await response.json();
    renderAuth(data.user);
    message('로그인되었습니다.');
    await loadNotes(true);
  } catch (e) {
    message(e.message ?? '로그인에 실패했습니다.', true);
  } finally {
    loginButton.disabled = false;
  }
});


logoutButton.addEventListener('click', async () => {
  logoutButton.disabled = true;
  message('로그아웃 중...');

  try {
    const response = await authRequest('/api/auth/logout', {
      method: 'POST'
    });

    if (!response.ok) {
      throw new Error(`로그아웃 실패 (${response.status})`);
    }

    renderAuth(null);
    resetEditor();
    memoMessage.textContent = '';
    await loadNotes(false);
    message('로그아웃되었습니다.');
  } catch (e) {
    message(e.message ?? '로그아웃에 실패했습니다.', true);
  } finally {
    logoutButton.disabled = false;
  }
});



async function restoreSession() {
  try {
    const response = await authRequest('/api/auth/session');

    if (!response.ok) {
      renderAuth(null);
      await loadNotes(false);
      return;
    }

    renderAuth({ email: '로그인 사용자' });
    await loadNotes(true);
  } catch {
    renderAuth(null);
    await loadNotes(false);
  }
}

void restoreSession();

  </script>
</body>
</html>
