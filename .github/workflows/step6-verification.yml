name: Step 6 decider test and submission bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current Git revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Practice registered and unregistered devices
        run: npm run decider:test
      - name: Prepare ignored local submission notes
        run: |
          node -e 'const fs=require("node:fs"); fs.writeFileSync("bundle-notes.json",JSON.stringify({explanation:"6단계 등록 기기만 자료실 판정 허용, 미등록 기기는 device_not_registered로 거부; 로컬 판정 시험과 기존 익명 접근 점검 수행",blockedAt:null},null,2)+"\n","utf8")'
      - name: Create submission JSON and run live anonymous checks
        run: npm run bundle
      - name: Verify submission metadata
        run: |
          node -e 'const fs=require("node:fs");const x=JSON.parse(fs.readFileSync("artifacts/submission.json","utf8"));if(x.step!==6||!x.policyRules.includes("device_registered")||!x.changedFiles.includes("src/decider.mjs"))process.exit(1);console.log("STEP 6 bundle verified; commit",x.commit.slice(0,12),"rules",x.policyRules.join(","),"self-checks",x.attackAttempts.length)'
      - name: Upload submission bundle for review
        uses: actions/upload-artifact@v4
        with:
          name: step6-submission
          path: artifacts/submission.json
          if-no-files-found: error
