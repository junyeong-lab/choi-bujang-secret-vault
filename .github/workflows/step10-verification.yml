name: Step 12 operations room and full regression submission

on:
  push:
    branches: [step10-recovery, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pinned Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify a clean npm install
        run: npm install --no-audit --no-fund
      - name: Verify backup and comparison with unchanged policy
        run: npm run policy:diff
      - name: Verify test-only altered policy scope before restoration
        run: npm run policy:diff -- --test-policy test/fixtures/step10-modified-policy.txt
      - name: Validate policy backup, restore, and fail-closed boundaries
        run: node --test test/step10-policy-diff.test.mjs test/step10-policy-restore.test.mjs
      - name: Validate single-memo restore endpoint and no-leak guard
        run: node --test test/step10-restore-api.test.mjs test/step10-restore-alias.test.mjs test/step10-env-restore.test.mjs
      - name: Verify post-restoration retest lifecycle
        run: node --test test/step10-post-restore-retest.test.mjs
      - name: Verify step-10 public restore discovery and canonical URL
        run: node --test test/step10-deployment-identity.test.mjs
      - name: 1-5 current application regression
        run: npm run test:r5
      - name: 11 PWA shell, unverified device display and public-only offline cache
        run: node --test test/step11-pwa-shell.test.mjs
      - name: 11 server-issued opaque handle and device approval lifecycle
        run: node --test test/step11-device-approval.test.mjs
      - name: 11 key non-exposure and server-side device handle approval
        run: node --test test/step11-no-device-token-exposure.test.mjs
      - name: 11 approved-at, expiry, offline and recheck fail-closed regression
        run: node --test test/step11-approval-lifecycle.test.mjs
      - name: 6-8 device, anomaly, resource-zone policy regression
        run: |
          npm run decider:test
          npm run fixture:7
          node --test test/step7.test.mjs test/step8.test.mjs
      - name: 9 revocation-proposal and normal-user regression
        run: |
          npm run detect:test
          node --test test/step9.test.mjs
      - name: 12 operations room redacted results and unrun checks
        run: node --test test/step12-ops.test.mjs
      - name: 12 isolated-bundle zero-network and not_run check
        run: node --test test/step12-bundle-isolation.test.mjs
      - name: XDR supplementary regression
        run: node --test test/xdr-run.test.mjs
      - name: Prepare excluded submission notes
        run: |
          node -e 'const fs=require("node:fs");fs.writeFileSync("bundle-notes.json",JSON.stringify({explanation:"12단계: 보호된 /api/ops와 탈환 작전실 화면을 추가했습니다. 1~11단계의 정상/금지 요청 자체 검증 계획 41칸 중 검증 가능한 안전한 GET 10종만 실제 프로덕션 HTTP 상태·요청 ID·시각으로 기록하고 나머지는 미실행으로 유지합니다. 기록은 서버 테이블 step12_ops_checks에 소유자별로 저장하며 쿠키·비밀키·사용자 정보·메모 본문은 저장하지 않습니다. 판정기 규칙 출처·탐지 원본/미실행·회수 미실행·복원 사본 메타데이터를 구분하고 화면 수치와 가린 로그를 동일한 DB 행에서 계산합니다. 학생 자체 HTTP 기대값 일치는 ALEPH 제공 엔진의 41종 공격 방어 또는 공식 심판 통과가 아닙니다. 기존 11단계 공식 100점 커밋과 1~10단계 기능을 보존했고, 단계 12 설정과 README 운영 안내를 갱신했습니다. 승인된 브라우저의 실제 10종 버튼 실측은 사용자 실행 후 확인합니다.",blockedAt:null},null,2)+"\n","utf8")'
      - name: Execute full bundle under audited subprocess sandbox model
        run: node --test test/step12-bundle-end-to-end.test.mjs
      - name: Build submission bundle using stage-12 unrun-safe checks
        run: npm run bundle
      - name: Check step 12 bundle contents
        run: |
          node -e 'const fs=require("node:fs");const x=JSON.parse(fs.readFileSync("artifacts/submission.json","utf8"));if(x.step!==12||x.restoreRoute!=="POST /api/restore/notes/:id"||!["device_registered","step_up_required","resource_zone"].every(a=>x.policyRules.includes(a))||x.attackAttempts.length!==18||!x.attackAttempts.every(a=>a.observed==="not_run"))process.exit(1);console.log("STEP12",x.commit.slice(0,12),"restoration",x.restoreRoute,"checks",x.attackAttempts.length)'
      - name: Archive submission JSON
        uses: actions/upload-artifact@v4
        with:
          name: step12-submission
          path: artifacts/submission.json
          if-no-files-found: error
