name: Step 11 verified-device app and regression submission

on:
  push:
    branches: [step10-recovery, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pinned Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify a clean npm install
        run: npm install --no-audit --no-fund
      - name: Verify backup and comparison with unchanged policy
        run: npm run policy:diff
      - name: Verify test-only altered policy scope before restoration
        run: npm run policy:diff -- --test-policy test/fixtures/step10-modified-policy.txt
      - name: Validate policy backup, restore, and fail-closed boundaries
        run: node --test test/step10-policy-diff.test.mjs test/step10-policy-restore.test.mjs
      - name: Validate single-memo restore endpoint and no-leak guard
        run: node --test test/step10-restore-api.test.mjs test/step10-restore-alias.test.mjs test/step10-env-restore.test.mjs
      - name: Verify post-restoration retest lifecycle
        run: node --test test/step10-post-restore-retest.test.mjs
      - name: Verify step-10 public restore discovery and canonical URL
        run: node --test test/step10-deployment-identity.test.mjs
      - name: 1-5 current application regression
        run: npm run test:r5
      - name: 11 PWA shell, unverified device display and public-only offline cache
        run: node --test test/step11-pwa-shell.test.mjs
      - name: 11 WebAuthn signature and server-approved device access
        run: node --test test/step11-device-approval.test.mjs
      - name: 6-8 device, anomaly, resource-zone policy regression
        run: |
          npm run decider:test
          npm run fixture:7
          node --test test/step7.test.mjs test/step8.test.mjs
      - name: 9 revocation-proposal and normal-user regression
        run: |
          npm run detect:test
          node --test test/step9.test.mjs
      - name: XDR supplementary regression
        run: node --test test/xdr-run.test.mjs
      - name: Prepare excluded submission notes
        run: |
          node -e 'const fs=require("node:fs");fs.writeFileSync("bundle-notes.json",JSON.stringify({explanation:"11단계: PWA manifest·아이콘·공개 오프라인 안내, 기기 등록 요청과 WebAuthn 서명 확인, 관리자 승인 전 보호 자료 API 거부, 승인 후 검증된 단기 HttpOnly 세션으로 접근합니다. 2026-10-14 실제 브라우저 패스키 등록·관리자 별도 승인·패스키 재확인 뒤 메모 표시와 서버의 유효 세션 1건을 확인했습니다. 미승인 기기의 실제 HTTP 403은 추가 실측 전이며 모의 요청에서 거부를 확인했습니다. 10단계 통과 복원 경로와 1~9단계 규칙을 보존했습니다.",blockedAt:null},null,2)+"\n","utf8")'
      - name: Build submission bundle using live anonymous checks
        run: npm run bundle
      - name: Check step 11 bundle contents
        run: |
          node -e 'const fs=require("node:fs");const x=JSON.parse(fs.readFileSync("artifacts/submission.json","utf8"));if(x.step!==11||x.restoreRoute!=="POST /api/restore/notes/:id"||!["device_registered","step_up_required","resource_zone"].every(a=>x.policyRules.includes(a))||x.attackAttempts.length!==4)process.exit(1);console.log("STEP11",x.commit.slice(0,12),"restoration",x.restoreRoute,"checks",x.attackAttempts.length)'
      - name: Archive submission JSON
        uses: actions/upload-artifact@v4
        with:
          name: step11-submission
          path: artifacts/submission.json
          if-no-files-found: error
