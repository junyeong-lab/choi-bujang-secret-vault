name: Step 7 anomaly policy and submission bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out committed revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test decider contract and device rules
        run: npm run decider:test
      - name: Test fixture anomalous requests
        run: npm run fixture:7
      - name: Test untrusted signals and combinations
        run: node --test test/step7.test.mjs
      - name: Prepare ignored local submission notes
        run: |
          node -e 'const fs=require("node:fs");fs.writeFileSync("bundle-notes.json",JSON.stringify({explanation:"7단계 기기 등록 조건 유지, 가상 복합 접속 신호에 step_up 요구, 엔진 확인 새 로그인 후 가상 요청 재평가. 실제 운영 자료 차단 실측은 미실행.",blockedAt:null},null,2)+"\n","utf8")'
      - name: Generate submission JSON and run live anonymous checks
        run: npm run bundle
      - name: Validate submission summary
        run: |
          node -e 'const fs=require("node:fs");const s=JSON.parse(fs.readFileSync("artifacts/submission.json","utf8"));if(s.step!==7||!s.changedFiles.includes("src/decider.mjs")||!s.policyRules.includes("device_registered")||!s.policyRules.includes("step_up_required")||s.attackAttempts.length<4)process.exit(1);console.log("STEP 7 bundle verified; commit",s.commit.slice(0,12),"changed",s.changedFiles.length,"rules",s.policyRules.join(","),"live anonymous checks",s.attackAttempts.length)'
      - name: Upload submission for review
        uses: actions/upload-artifact@v4
        with:
          name: step7-submission
          path: artifacts/submission.json
          if-no-files-found: error
