name: Step 10 safe policy diff preview

on:
  push:
    branches: [step10-recovery]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate source and preview unchanged policy
        run: npm run policy:diff
      - name: Preview a modified TEST policy
        run: npm run policy:diff -- --test-policy test/fixtures/step10-modified-policy.txt
      - name: Test backup validation and safety
        run: node --test test/step10-policy-diff.test.mjs
      - name: Test isolated policy restoration safeguards
        run: node --test test/step10-policy-restore.test.mjs
      - name: Verify prior 6-9 stages
        run: |
          npm run decider:test
          npm run fixture:7
          npm run detect:test
          node --test test/step7.test.mjs test/step8.test.mjs test/step9.test.mjs
