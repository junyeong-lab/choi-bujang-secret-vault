name: Step 8 zone policy and submission bundle
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run decider:test
      - run: npm run fixture:7
      - run: node --test test/step7.test.mjs test/step8.test.mjs
      - name: Prepare local ignored notes
        run: |
          node -e 'const fs=require("node:fs");fs.writeFileSync("bundle-notes.json",JSON.stringify({explanation:"8단계 메모와 강사 공지의 자원 ID 및 서버 API 권한 분리. 기존 기기 등록과 이상 징후 정책 유지. 실제 강사 권한은 초기 미부여, 실제 로그인 직접 확인은 별도 진행.",blockedAt:null},null,2)+"\n","utf8")'
      - run: npm run bundle
      - name: Verify bundle
        run: |
          node -e 'const fs=require("node:fs");const x=JSON.parse(fs.readFileSync("artifacts/submission.json","utf8"));if(x.step!==8||!x.policyRules.includes("resource_zone")||!x.changedFiles.includes("src/decider.mjs"))process.exit(1);console.log("STEP 8 bundle",x.commit.slice(0,12),"checks",x.attackAttempts.length)'
      - uses: actions/upload-artifact@v4
        with:
          name: step8-submission
          path: artifacts/submission.json
          if-no-files-found: error
